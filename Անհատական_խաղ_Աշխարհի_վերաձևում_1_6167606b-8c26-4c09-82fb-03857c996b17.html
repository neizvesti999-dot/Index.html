function qc(a,d){var all=[];D.A.forEach(function(x){x.dec.forEach(function(y){if(y!==d)all.push(y)})});var o=sh([d].concat(sh(all).slice(0,2)));var real=d.opts.filter(function(x){return x.real})[0];return{title:d.ctx,sub:a.name+". ո՞ր հարցի մասին է",opts:o.map(function(x){return{t:x.title}}),ri:o.indexOf(d),fb:"Սա «"+h(d.title)+"» հարցն է։ Իրականում ընդունվեց՝ «"+h(real.t)+"»։ "+h(real.note)}}
function pool(c){var r=[];if(c==="m")D.M.forEach(function(m){r.push({k:m.n,f:function(){return qm(m)}})});else D.A.forEach(function(a){a.dec.forEach(function(d){r.push({k:d.title,f:function(){return c==="d"?qd(a,d):qc(a,d)}})})});return r}
function draw(c,used){var n=0;while(n++<200){if(!DK[c].length)DK[c]=sh(pool(c));var it=DK[c].pop();if(used.indexOf(it.k)<0){used.push(it.k);return it.f()}DK[c].unshift(it)}return pool(c)[0].f()}
function deal(){DK={m:[],d:[],c:[]};S.P.forEach(function(p){var u={m:[],d:[],c:[]},Q=[];[["m",3],["d",4],["c",3]].forEach(function(x){for(var i=0;i<x[1];i++)Q.push(draw(x[0],u[x[0]]))});p.Q=sh(Q)})}
function setup(){bar.innerHTML="";
 app.innerHTML='<div class="card"><h2>Անհատական խաղ՝ 7 մասնակցի համար</h2><p>Յուրաքանչյուր մասնակից առանձին պատասխանում է 10 հարցի, և <b>հարցերը բոլորի համար տարբեր են</b> («Աշխարհի վերաձևում» նյութից՝ 3 քարտեզային, 4 որոշման և 3 «ո՞ր հարցի մասին է» հարց)։ Ճիշտ պատասխանը՝ 10 միավոր։ <b>Միավորը երևում է պատասխանից անմիջապես հետո։</b> Վերջում կազմվում է 7 մասնակիցների վարկանիշը։</p><p class="soft">Գրեք մասնակիցների անունները (դատարկը՝ «Մասնակից N»)։</p>'+Array.apply(null,Array(N)).map(function(_,i){return '<input class="tin" type="text" id="n'+i+'" placeholder="Մասնակից '+(i+1)+'" aria-label="Մասնակից '+(i+1)+'">'}).join("")+'<button class="go" id="st">Սկսել</button></div>';
 document.getElementById("st").onclick=function(){S.P=Array.apply(null,Array(N)).map(function(_,i){return{n:document.getElementById("n"+i).value.trim()||"Մասնակից "+(i+1),s:0,c:0}});deal();S.p=0;turn()}}
function turn(){var p=S.P[S.p];bar.innerHTML=S.P.map(function(_,i){return '<i class="'+(i<S.p?"on":"")+'"></i>'}).join("");S.qi=0;p.s=0;p.c=0;
 app.innerHTML='<div class="card"><p class="soft">Մասնակից '+(S.p+1)+' / '+N+'</p><h2>Հերթը՝ '+h(p.n)+'</h2><p>Սպասվում է 10 հարց։ Պատրա՞ստ եք։</p><button class="go" id="go">Սկսել հարցերը</button></div>';
 document.getElementById("go").onclick=ask}
function ask(){var p=S.P[S.p],q=p.Q[S.qi];
 app.innerHTML='<div class="live"><span>'+h(p.n)+' · հարց '+(S.qi+1)+' / '+PER+'</span><span>Միավոր՝ <b id="sc">'+p.s+'</b></span></div><div class="card"><p class="soft">'+h(q.sub)+'</p><h3>'+h(q.title)+'</h3><div>'+q.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+(o.d?'<b>'+h(o.t)+'</b><br><span class="soft">'+h(o.d)+'</span>':h(o.t))+'</button>'}).join("")+'</div><div id="fb"></div></div>';
 [].forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){var i=+b.dataset.i,ok=i===q.ri;if(ok){p.s+=10;p.c++}
  [].forEach.call(app.querySelectorAll(".opt"),function(x){x.disabled=true;if(+x.dataset.i===q.ri)x.classList.add("good")});if(!ok)b.classList.add("bad");
  document.getElementById("sc").textContent=p.s;
  document.getElementById("fb").innerHTML='<div class="fb"><span class="pop'+(ok?"":" no")+'">'+(ok?"Ճիշտ է. +10 միավոր։":"Սխալ է. +0 միավոր։")+' Ձեր միավորը՝ '+p.s+' / '+(S.qi+1)*10+'</span><br>'+q.fb+'</div><button class="go" id="nx">'+(S.qi<PER-1?"Հաջորդ հարցը":"Տեսնել իմ արդյունքը")+'</button>';
  document.getElementById("nx").onclick=function(){if(S.qi<PER-1){S.qi++;ask()}else mine()}}})}
function gr(s){return Math.max(1,Math.round(s/10))}
function mine(){var p=S.P[S.p],last=S.p===N-1;
 app.innerHTML='<div class="card"><p class="soft">'+h(p.n)+'</p><div class="big">'+p.s+' / 100</div><h2>Գնահատական՝ '+gr(p.s)+' / 10</h2><p>Ճիշտ պատասխաններ՝ '+p.c+' / '+PER+'։</p><button class="go" id="nx">'+(last?"Տեսնել վարկանիշը":"Հաջորդ մասնակիցը")+'</button></div>';
 document.getElementById("nx").onclick=function(){if(last)board();else{S.p++;turn()}}}
function board(){bar.innerHTML="";var R=S.P.slice().sort(function(a,b){return b.s-a.s});
 app.innerHTML='<div class="card"><h2>Վերջնական վարկանիշ</h2><table>'+R.map(function(p,i){return '<tr><td>'+(i+1)+'. '+h(p.n)+'</td><td>'+p.s+' / 100 · '+gr(p.s)+' / 10</td></tr>'}).join("")+'</table><p>Միջին արդյունք՝ <b>'+Math.round(S.P.reduce(function(a,p){return a+p.s},0)/N)+' / 100</b></p><div class="nop"><button class="go" onclick="window.print()">Տպել արդյունքը</button> <button onclick="setup()">Նոր խաղ</button></div></div>'}
setup();
</script></body></html>
